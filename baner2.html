<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>banner</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.css"
    />
    <style>
      :root {
        --themecolor1: #425a8b;
        --themecolor2: #fd9636;
        --themecolor3: #6b83b6;
        --themecolor4: #253d6c;
        --themecolor5: #b3bdd1;
        --themecolor6: #efefef;
      }

      .learn {
        color: var(--themecolor2);
        font-size: x-small;
        font-weight: 600;
        margin-top: 40px;
        text-decoration-line: none;
      }
      .learn :hover {
        color: #425a8b;
      }


      .btnsuper {background-color:var(--themecolor2);
                font-size: 13px;
                font-weight: 500;}

     .btnsuper:hover {
        background-color: var(--themecolor1);
      }


      .xboxbtn{
        background-color: #27b3d2;
        font-size: 13px;
        font-weight: 500;
      }

      .xboxbtn:hover {
        background-color: var(--themecolor1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center gx-2 mt-3">
        <!--left column xbox-->
        <div class="col-xl-4 col-lg-12">
          <div
            class="card position-relative"
            style="border: none; height: 450px"
          >
            <img class="rounded-2 h-100" src="./banner2/xbox.jpg" alt="" />
            <div class="position-absolute ms-4 mt-5">
              <p class="text-danger my-1" style="font-size: 10px">
                FLAT 20% OFF
              </p>
              <h2 class="fw-bold my-0 fs-3">Microsoft</h2>
              <h1
                class="fw-bold"
                style="color: var(--themecolor4); font-size: 50px"
              >
                Xbox
              </h1>
              <h1
                style="
                  color: var(--themecolor4);
                  font-family:
                    &quot;Franklin Gothic Medium&quot;,
                    &quot;Arial Narrow&quot;, Arial, sans-serif;
                  font-size: 45px;
                "
              >
                Series S
              </h1>
              <p
                class="small"
                style="
                  color: var(--themecolor4);
                  font-size: 13px;
                  font-weight: 400;
                "
              >
                From $3500.00
              </p>

              <button href="#" class="btn xboxbtn px-5 text-light">Shop Now</button>
            </div>
          </div>
        </div>
        <!--right column controller metavers electronic phones-->

        <div class="col-xl-8 col-lg-12 d-flex">
          <div class="container">
            <div class="row">
              <div class="col mb-3">
                <!--cards-1st-line-->
                <div
                  class="col card position-relative w-100 me-3"
                  style="border: none; height: 205px"
                >
                  <img
                    class="h-100 rounded-2"
                    src="./banner2/Controller-Aqua-Shift.jpg"
                    alt=""
                  />
                  <div class="position-absolute p-4" style="margin-left: 250px">
                    <h2
                      style="
                        font-size: 20px;
                        font-weight: 700;
                        font-family: Arial, Helvetica, sans-serif;
                      "
                    >
                      Xbox Core wireless Controller
                    </h2>

                    <p
                      class="small"
                      style="
                        color: rgb(92, 188, 230);
                        font-size: 16px;
                        font-family: Arial, Helvetica, sans-serif;
                      "
                    >
                      Aqua Shift Special Edition
                    </p>
                    
                      <button
                      href="#"
                        class="btn xboxbtn text-light"
                        >
                        Shop Now
                        <i><img
                            style="height: 15px"
                            src="./banner2/arrow2.jpg"
                            alt=""
                        /></i></button>
                  </div>
                </div>
              </div>
              <div class="col-4">
                <div class="card" style="border: none; height: 205px">
                  <img
                    class="rounded-2 h-100"
                    src="./banner2/IMG_6509.JPG"
                    alt=""
                  />
                  <div class="position-absolute p-3">
                    <h1
                      style="
                        font-weight: 700;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 20px;
                      "
                    >
                      Metaverse
                    </h1>
                    <p
                      style="color: #425a8b; font-size: 16px; line-height: 23px"
                    >
                      The Future of Creativity
                    </p>
                    <a class="learn" href="#"
                      ><p class="learn">LEARN MORE</p></a
                    >
                  </div>
                </div>
              </div>
            </div>

            <!--cards-2nd-line-->
            <div class="row d-flex justify-content-center">
              <div class="col-md-12 d-flex">
                <div class="col-4">
                <div class="card" style="border: none; height: 225px">
                  <img
                    class="rounded-2 h-100"
                    src="./banner2/multi.JPG"
                    alt=""
                  />
                  <div class="position-absolute p-4 ms-3">
                    <h1
                      style="
                      
                        font-weight: 700;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 20px;
                        display: flex;
                        justify-content:center ;
                      "
                    >
                      Electronic
                    </h1>
                    <p
                      style="color: #425a8b; font-size: 16px; line-height: 23px"
                    >
                      Hot devices, Latest trending
                    </p>
                
                  </div>
                </div>
              </div>
              <div
                  class="col-8 card position-relative ms-2"
                  style="border: none; height: 225px;"
                >
                  <img
                    class="h-100 rounded-2"
                    src="./banner2/mobil.jpg"
                    alt=""
                  />
                  <div class="position-absolute p-4" >
                    <h2
                      style="
                        width:260px;
                        font-size: 25px;
                        font-weight: 700;
                        font-family: Arial, Helvetica, sans-serif;
                      "
                    >
                      Super discount for your first purchase
                    </h2>

                    <p
                      class="small"
                      style="
                        color: rgb(92, 188, 230);
                        font-size: 16px;
                        font-family: Arial, Helvetica, sans-serif;
                      "
                    >
                      Use discount code in checkout page
                    </p>
                    
                      <button
                      href="#"
                        class="btn btnsuper text-light"
                        >
                        Shop Now
                        </button>
                  </div>
                </div>
            </div>
          </div>
          <!--end card-2-line-->
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="./enable-stuff.js"></script>
  </body>
</html>
